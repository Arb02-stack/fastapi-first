[project]
name = "fastapi-first"
version = "0.1.0"
description = ""
authors = [
    {name = "arix",email = "arix0001@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "bcrypt (==3.2.2)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]

[tool.poetry]
packages = [{include = "fastapi_first", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
